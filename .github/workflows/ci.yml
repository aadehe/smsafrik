name: CI

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.14.3-jdk21

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test
        run: gradle build --no-daemon
